<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Volunteer History</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#1a6b3c" />
<link rel="stylesheet" href="style.css" />
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 1rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--color-border); }
  th { background: #eef2ee; }
  .top-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .top-actions a.btn, .top-actions button.btn { text-decoration: none; text-align: center; width: auto; padding: 14px 20px; display: inline-block; }
  .open-row { color: var(--color-primary); font-weight: 700; }
  .note { font-size: 0.95rem; color: var(--color-muted); margin-top: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <h1>Volunteer History</h1>
</header>

<main id="app" style="max-width: 960px;">
  <div class="top-actions">
    <a href="index.html" class="btn btn-primary">&larr; Back to Sign In</a>
    <button type="button" id="download-csv" class="btn btn-primary">Download CSV</button>
  </div>
  <p class="note">This history is stored on this device only. Download a CSV backup regularly.</p>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Date</th>
        <th>Sign In</th>
        <th>Sign Out</th>
        <th>Duration</th>
      </tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>
</main>

<script src="db.js"></script>
<script src="admin.js"></script>
<script src="register-sw.js"></script>
</body>
</html>
