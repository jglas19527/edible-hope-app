<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#03989e" />
<link rel="stylesheet" href="style.css" />
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 1rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--color-border); }
  th { background: #e6f5f5; }
  .top-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .top-actions a.btn { text-decoration: none; text-align: center; width: auto; padding: 14px 20px; display: inline-block; }
  .meals-row-actions { display: flex; gap: 8px; }
  .meals-row-actions button { width: auto; margin: 0; padding: 6px 12px; font-size: 0.9rem; border-radius: 8px; }
  .btn-small-danger { background: var(--color-danger); color: #fff; border: none; cursor: pointer; }
  .btn-small-edit { background: var(--color-border); color: var(--color-text); border: none; cursor: pointer; }
</style>
</head>
<body>

<div id="admin-content" class="hidden">

<header class="topbar">
  <div class="topbar-brand">
    <img src="icons/logo.png" alt="Edible Hope Kitchen logo" class="topbar-logo" />
    <h1>Admin Dashboard</h1>
  </div>
</header>

<main id="app" style="max-width: 960px;">
  <div class="top-actions">
    <a href="index.html" class="btn btn-primary">&larr; Back to Clock In</a>
    <a href="admin.html" class="btn btn-primary">Volunteer History</a>
  </div>

  <h2 class="section-heading">Volunteer Stats</h2>
  <div id="volunteer-stats" class="stat-grid"></div>

  <h2 class="section-heading">Top Volunteers (by hours)</h2>
  <ul id="top-volunteers" class="top-volunteers-list"></ul>

  <h2 class="section-heading">Meals Served</h2>
  <div id="meal-stats" class="stat-grid"></div>

  <form id="meals-form" class="meals-form">
    <div class="field-group">
      <label class="field-label" for="meals-date">Date</label>
      <input id="meals-date" class="field-input" type="date" required />
    </div>
    <div class="field-group">
      <label class="field-label" for="meals-count">Meals served</label>
      <input id="meals-count" class="field-input" type="number" min="0" step="1" required />
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  <p id="meals-error" class="error-text hidden"></p>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Meals Served</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="meals-body"></tbody>
  </table>
</main>

</div>

<script src="db.js"></script>
<script src="dashboard.js"></script>
<script src="admin-auth.js"></script>
<script src="register-sw.js"></script>
</body>
</html>
